<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Core Thunder Bolt Gradient -->
    <linearGradient id="thunder-gradient" x1="160" y1="36" x2="350" y2="476" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE600" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>

    <!-- Inner Specular / 3D Bevel Highlight -->
    <linearGradient id="thunder-highlight" x1="120" y1="40" x2="280" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="40%" stop-color="#FFF4B8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Main Electric Thunder Bolt -->
  <polygon
    points="284,40 104,272 252,272 228,472 408,240 260,240"
    fill="url(#thunder-gradient)"
    stroke="url(#thunder-gradient)"
    stroke-width="24"
    stroke-linejoin="round"
  />

  <!-- High-Gloss Specular Facet -->
  <path
    d="M280,48 L116,264 L244,264 L232,370 L266,190 Z"
    fill="url(#thunder-highlight)"
  />
</svg>
